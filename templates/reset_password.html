{% block content %}
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
    }

    .page-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: linear-gradient(135deg, #596972, #2c4052);
    }

    .form-box {
        background: white;
        padding: 50px 40px;
        border-radius: 16px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.2);
        text-align: center;
    }

    .page-title {
        font-size: 26px;
        color: #2c4052;
        margin-bottom: 25px;
    }

    .alert {
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px;
        font-size: 14px;
        text-align: left;
    }

    .alert-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
    }

    .alert-error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
    }

    label {
        font-size: 14px;
        font-weight: 600;
        color: #333;
    }

    input {
        width: 100%;
        padding: 14px;
        margin: 8px 0 18px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #363d44, #41677e);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }

    button:hover {
        background: linear-gradient(135deg, #2c4052, #41677e);
    }

    a {
        color: #2c4052;
        text-decoration: none;
    }
</style>

<div class="page-container">
    <div class="form-box">
        <h2 class="page-title">🔒 Reset Password</h2>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {% if category == 'success' %}alert-success{% else %}alert-error{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Password Reset Form -->
        <form method="POST" style="text-align:left;">
            <label>🆕 New Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter new password"
                   required minlength="4">

            <label>🔁 Confirm Password</label>
            <input type="password"
                   name="confirm_password"
                   placeholder="Confirm new password"
                   required minlength="4">

            <button type="submit">💾 Update Password</button>
        </form>

        <div style="margin-top:20px;">
            <a href="{{ url_for('admin_login') }}">← Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
